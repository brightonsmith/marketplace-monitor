[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketmon"
version = "0.3.3"
description = "Monitor Facebook Marketplace searches and send notifications for new matching listings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "geopy>=2.4,<3",
    "playwright>=1.54,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
marketmon = "marketplace_monitor.cli:main"
marketplace-monitor = "marketplace_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketplace_monitor = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
