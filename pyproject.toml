[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-monitor"
version = "0.2.0"
description = "Monitor Facebook Marketplace searches and send notifications for new matching listings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.54,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
marketmon = "marketplace_monitor.cli:main"
marketplace-monitor = "marketplace_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketplace_monitor = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
