<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#132a24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Marketmon">
    <title>{% block title %}Marketmon{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='app-icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='app-icon-180.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
  </head>
  <body data-time-zone="{{ display_timezone }}" data-time-format="{{ display_time_format }}" {% block body_attributes %}{% endblock %}>
    <div class="app-shell">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
